name: Staging binary package (no deployment)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vnext
    env:
      CGO_ENABLED: '1'
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Test pinned source
        run: |
          go mod download
          go mod verify
          go test -tags live_ws,sqlite_integration,secure_auth ./...
          python3 tests/schema_check.py
          python3 tests/resource_probe_test.py
          python3 tests/staging_preflight_test.py
          python3 tests/phase7_evidence_test.py
      - name: Build isolated binaries and record provenance
        run: |
          set -eu
          out="$RUNNER_TEMP/md-staging-package"
          mkdir -m 700 "$out"
          go build -trimpath -tags live_ws,sqlite_integration,secure_auth -o "$out/marketdepth-staging" ./cmd/marketdepth-staging
          go build -trimpath -tags sqlite_integration -o "$out/day-audit" ./cmd/day-audit
          cp tools/resource_probe.py tools/resource_summary.py tools/staging_preflight.py tools/phase7_evidence.py "$out/"
          cp docs/PHASE_7_QA_RUNBOOK.md "$out/"
          printf '%s\n' "$GITHUB_SHA" > "$out/PRODUCER_COMMIT"
          go version > "$out/BUILD_INFO.txt"
          go version -m "$out/marketdepth-staging" >> "$out/BUILD_INFO.txt"
          ldd "$out/marketdepth-staging" >> "$out/BUILD_INFO.txt"
          cd "$out"
          sha256sum marketdepth-staging day-audit *.py PHASE_7_QA_RUNBOOK.md PRODUCER_COMMIT BUILD_INFO.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: marketdepth-staging-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/md-staging-package/
          if-no-files-found: error
          retention-days: 14
