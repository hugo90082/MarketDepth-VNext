name: Phase 5 import coordinator QA (no deployment)
on:
  push:
    branches: [phase5-legacy-import-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: vnext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify pinned dependencies and run tests
        env:
          CGO_ENABLED: '1'
        run: |
          go mod download
          go mod verify
          go test ./...
          go test -tags sqlite_integration ./...
          go test -tags live_ws,sqlite_integration,secure_auth ./...
          go vet -tags live_ws,sqlite_integration,secure_auth ./...
          go build -tags sqlite_integration ./cmd/legacy-v66-plan
          python3 tests/schema_check.py
          python3 tests/daily_sql_check.py
      # Real history is private; never upload it to CI. Tests requiring the
      # private dataset skip. The real-data offline report is separate.
