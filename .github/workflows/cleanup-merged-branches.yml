name: One-time merged branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-merged-branches.yml']
permissions:
  contents: read
jobs:
  cleanup:
    if: github.repository == 'hugo90082/MarketDepth-VNext' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only exact already-merged refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          for spec in 'develop:65ba74857b641e9536fd0fbc6b423a3d22c7e1c7' 'qa/spot-probe-20261113:d095413acdc4662cfb15dfdb293562334dded747'; do
            branch="${spec%:*}"
            expected="${spec##*:}"
            ref="refs/heads/$branch"
            actual="$(git ls-remote --heads origin "$ref" | cut -f1)"
            if [[ -z "$actual" ]]; then echo "Already absent: $branch"; continue; fi
            [[ "$actual" == "$expected" ]] || { echo "Ref changed; refuse $branch"; exit 1; }
            git merge-base --is-ancestor "$expected" origin/main || { echo "Not merged; refuse $branch"; exit 1; }
            git push --force-with-lease="$ref:$expected" origin ":$ref"
          done
