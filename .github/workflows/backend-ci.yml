name: Backend CI (no deployment)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vnext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Resolve pinned dependencies
        run: |
          go mod download -json
          go mod verify
      - name: Go checks
        env:
          CGO_ENABLED: '1'
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go test -tags sqlite_integration -v ./internal/store
          go test -race -tags sqlite_integration ./internal/store
          go test -tags live_ws,sqlite_integration,secure_auth ./...
          go vet -tags live_ws,sqlite_integration,secure_auth ./...
          go build -tags live_ws,sqlite_integration ./cmd/spotprobe
          go build -tags live_ws,sqlite_integration ./cmd/futuresprobe
          go build ./cmd/marketdepth
      - name: SQL contracts
        run: |
          python3 tests/schema_check.py
          python3 tests/daily_sql_check.py
