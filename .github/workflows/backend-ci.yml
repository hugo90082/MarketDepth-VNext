name: Backend CI (no deployment)
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vnext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Resolve pinned dependencies
        run: go mod download -json github.com/mattn/go-sqlite3
      - name: Go checks
        env:
          CGO_ENABLED: '1'
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go test -tags sqlite_integration -v ./internal/store
          go build ./cmd/marketdepth
          cat go.sum
      - name: SQL contracts
        run: |
          python3 tests/schema_check.py
          python3 tests/daily_sql_check.py
