name: Isolated full-day capacity QA (synthetic only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vnext/internal/store/capacity_qa_integration_test.go'
      - '.github/workflows/capacity-qa.yml'
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vnext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Resolve pinned dependencies
        run: go mod download && go mod verify
      - name: Full-day SQLite capacity fixtures
        env:
          CGO_ENABLED: '1'
        run: go test -tags sqlite_integration,capacity_qa -run '^TestCapacityQAFullDay$' -v -count=1 -timeout=16m ./internal/store
